
name: Build EGY VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/multi-engine-foundation

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          print("Checking:", path)

          if not path.exists():
              raise SystemExit("ERROR: Manifest file not found!")

          try:
              content = path.read_bytes()
              content.decode("utf-8-sig")
              ET.fromstring(content)
              print("SUCCESS: AndroidManifest.xml is valid XML")
          except UnicodeDecodeError as e:
              print("ENCODING ERROR:", e)
              raise
          except ET.ParseError as e:
              print("XML PARSE ERROR:", e)
              raise
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: EGY-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
