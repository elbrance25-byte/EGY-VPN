
name: Build EGY VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/multi-engine-foundation

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Build MasterDnsVPN Go AAR
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260312152759-81488f6aeb60
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          # Build DNSTT from source with the exact same Go/gomobile toolchain as MasterDnsVPN.
          # This guarantees both AARs use a compatible shared libgojni runtime.
          mkdir -p /tmp/dnstt-source app/libs
          curl -fsSL "https://codeload.github.com/dnstt-xyz/dnstt_xyz_app/zip/8155cde0353433646aceacca1414913fc9a304a7" -o /tmp/dnstt-source.zip
          unzip -q /tmp/dnstt-source.zip -d /tmp/dnstt-source
          DNSTT_ROOT="$(find /tmp/dnstt-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cd "$DNSTT_ROOT/go_src"
          gomobile bind -v -target android/arm64,android/arm -androidapi 26 -o "$GITHUB_WORKSPACE/app/libs/dnstt-upstream.aar" ./mobile
          test -s "$GITHUB_WORKSPACE/app/libs/dnstt-upstream.aar"
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/masterdns-source
          curl -fsSL "https://codeload.github.com/RevocGG/MasterDnsVPN-AndroidGG/zip/88fe4fef79b67ca98543d4ee58a85962857e5721" -o /tmp/masterdns-source.zip
          unzip -q /tmp/masterdns-source.zip -d /tmp/masterdns-source
          SOURCE_DIR="$(find /tmp/masterdns-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cd "$SOURCE_DIR"
          export GOFLAGS="-mod=mod"
          gomobile bind -v -target android/arm64,android/arm -androidapi 26 -javapkg com.egyvpn.masterdns.gomobile -o "$GITHUB_WORKSPACE/app/libs/masterdnsvpn-upstream.aar" ./cmd/android
          test -s "$GITHUB_WORKSPACE/app/libs/masterdnsvpn-upstream.aar"

      - name: Verify shared Go JNI runtime
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          files = {"DNSTT": "app/libs/dnstt-upstream.aar", "MasterDnsVPN": "app/libs/masterdnsvpn-upstream.aar"}
          for abi in ("arm64-v8a", "armeabi-v7a"):
              entry = f"jni/{abi}/libgojni.so"
              hashes = {}
              for name, path in files.items():
                  with zipfile.ZipFile(path) as archive:
                      hashes[name] = hashlib.sha256(archive.read(entry)).hexdigest()
              print(abi, hashes)
              if len(set(hashes.values())) != 1:
                  raise SystemExit(f"Go JNI runtime mismatch for {abi}; refusing unsafe APK packaging")
          PY

      - name: Validate Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          print("Checking:", path)

          if not path.exists():
              raise SystemExit("ERROR: Manifest file not found!")

          try:
              content = path.read_bytes()
              content.decode("utf-8-sig")
              ET.fromstring(content)
              print("SUCCESS: AndroidManifest.xml is valid XML")
          except UnicodeDecodeError as e:
              print("ENCODING ERROR:", e)
              raise
          except ET.ParseError as e:
              print("XML PARSE ERROR:", e)
              raise
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: EGY-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
